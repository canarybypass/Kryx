<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','SF Mono',ui-monospace,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08090C"/><stop offset="1" stop-color="#0A0B10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.1" r="0.7">
      <stop stop-color="#C8F135" stop-opacity="0.10"/><stop offset="1" stop-color="#C8F135" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <rect width="1280" height="300" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="2" fill="#C8F135" fill-opacity="0.5"/>

  <!-- wordmark -->
  <g transform="translate(96,118)">
    <circle cx="11" cy="0" r="9" fill="#C8F135"/>
    <text x="44" y="20" font-size="66" font-weight="700" fill="#F0F1F3" letter-spacing="-1">KRYX</text>
  </g>

  <text x="98" y="184" font-size="19" fill="#9199A6">Autonomous offensive-security agent</text>

  <!-- authentic terminal line -->
  <g transform="translate(98,214)">
    <text font-size="15" fill="#525A67">$ </text>
    <text x="18" font-size="15" fill="#C8F135">kryx engage</text>
    <text x="150" font-size="15" fill="#9199A6">--target https://app.example.com --scope prod</text>
  </g>
  <g transform="translate(98,240)" font-size="13">
    <text fill="#64D8A3">[report]</text>
    <text x="72" fill="#9199A6">5 findings · 1 chain · every one proven by execution</text>
  </g>
</svg>
