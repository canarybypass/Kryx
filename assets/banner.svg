<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08090C"/>
      <stop offset="1" stop-color="#0C0E13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop stop-color="#C8F135" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#C8F135" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- wordmark -->
  <g transform="translate(96,150)">
    <circle cx="12" cy="0" r="10" fill="#C8F135"/>
    <circle cx="12" cy="0" r="18" fill="none" stroke="#C8F135" stroke-opacity="0.35"/>
    <text x="52" y="18" font-size="76" font-weight="700" fill="#F0F1F3" letter-spacing="-2">KRYX</text>
  </g>

  <!-- tagline -->
  <text x="98" y="228" font-size="22" fill="#9199A6">Autonomous offensive-security agent.</text>
  <text x="98" y="262" font-size="17" fill="#525A67">Finds vulnerabilities, proves each one by execution, chains them to real impact.</text>

  <!-- accent underline -->
  <rect x="98" y="292" width="120" height="3" rx="1.5" fill="#C8F135"/>

  <!-- right side: pipeline chips -->
  <g transform="translate(820,120)" font-size="13" fill="#C8F135">
    <g>
      <rect x="0"   y="0"  width="150" height="30" rx="15" fill="#C8F135" fill-opacity="0.08" stroke="#C8F135" stroke-opacity="0.3"/>
      <text x="18" y="20">recon → crawl</text>
    </g>
    <g transform="translate(170,0)">
      <rect width="160" height="30" rx="15" fill="#2DE2E6" fill-opacity="0.08" stroke="#2DE2E6" stroke-opacity="0.3"/>
      <text x="18" y="20" fill="#2DE2E6">sweep → hunt</text>
    </g>
    <g transform="translate(40,44)">
      <rect width="180" height="30" rx="15" fill="#9B6DFF" fill-opacity="0.08" stroke="#9B6DFF" stroke-opacity="0.3"/>
      <text x="18" y="20" fill="#9B6DFF">adversarial debate</text>
    </g>
    <g transform="translate(140,88)">
      <rect width="190" height="30" rx="15" fill="#64D8A3" fill-opacity="0.08" stroke="#64D8A3" stroke-opacity="0.3"/>
      <text x="18" y="20" fill="#64D8A3">chains → report + fix</text>
    </g>
  </g>
</svg>
