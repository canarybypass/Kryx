services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      HEXOR_SANDBOX_DIR: /tmp/hexor-sandbox
    volumes:
      - sandbox:/tmp/hexor-sandbox
    networks:
      - hexor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hexor

volumes:
  sandbox:

networks:
  hexor:
    driver: bridge
