services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kryx
      POSTGRES_USER: kryx
      POSTGRES_PASSWORD: kryx
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kryx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kryx"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://kryx:kryx@postgres:5432/kryx
      KRYX_SANDBOX_DIR: /tmp/kryx-sandbox
    volumes:
      - sandbox:/tmp/kryx-sandbox
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kryx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kryx

volumes:
  pgdata:
  sandbox:

networks:
  kryx:
    driver: bridge
