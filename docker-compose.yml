services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vulnyx
      POSTGRES_USER: vulnyx
      POSTGRES_PASSWORD: vulnyx
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - vulnyx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnyx"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://vulnyx:vulnyx@postgres:5432/vulnyx
      VULNYX_SANDBOX_DIR: /tmp/vulnyx-sandbox
    volumes:
      - sandbox:/tmp/vulnyx-sandbox
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vulnyx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vulnyx

volumes:
  pgdata:
  sandbox:

networks:
  vulnyx:
    driver: bridge
